<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Maletica · Outfits y maleta de viaje</title>
    <meta name="description" content="Planea el outfit de cada día y arma tu maleta desde tu armario. Sin llevar de más ni olvidar nada." />
    <meta name="theme-color" content="#7254BE" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Maletica" />
    <meta property="og:description" content="Planea el outfit de cada día y arma tu maleta desde tu armario." />
    <meta property="og:url" content="https://maletica.vercel.app/" />
    <meta property="og:image" content="https://maletica.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_CO" />
    <link rel="canonical" href="https://maletica.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Caveat:wght@600&display=swap" />

    <!-- Aplica el tema guardado antes de pintar, para que no parpadee -->
    <script>
      try {
        var t = localStorage.getItem('maletica-tema')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Maletica necesita JavaScript activado.</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
